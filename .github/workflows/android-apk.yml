name: Build SmartCradle Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Sync SmartCradle web assets into Android project
        run: npm run sync:android

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to friendly filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartCradle-debug.apk

      - name: Upload SmartCradle-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCradle-debug-apk
          path: SmartCradle-debug.apk
          if-no-files-found: error
          retention-days: 30
